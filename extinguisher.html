<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SafetyVerse AR: Fire Extinguisher</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js"></script>
  <style>
    :root { --accent: #ff9800; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #071120; color: #eef6ff; }
    header { padding: 18px; text-align: center; background: #1e2d43; border-bottom: 1px solid #334863; }
    h1 { margin: 0; color: #ff9800; font-size: 1.35rem; }
    header p { margin: 6px 0 0; color: #c4d3e6; font-size: .9rem; }
    model-viewer { display: block; width: 100%; height: 52vh; min-height: 380px; background: radial-gradient(circle at 50% 35%, #20385b, #071120 73%); }
    #ar-button { background: var(--accent); border: 0; border-radius: 999px; color: #14100a; font-weight: 800; font-size: 1rem; padding: 14px 21px; box-shadow: 0 4px 18px #ff6b0066; }
    .tip { margin: 0; padding: 12px 18px; text-align: center; color: #cfdaea; font-size: .84rem; background: #0d1a2c; }
    main { padding: 16px; max-width: 760px; margin: auto; }
    .info { background: #14233a; border: 1px solid #314967; border-radius: 14px; padding: 18px; }
    h2 { margin: 0 0 10px; color: #ff9800; font-size: 1.1rem; }
    .description { margin: 0; color: #e6eef9; line-height: 1.5; }
    .function, .warning { margin-top: 14px; padding: 12px; border-radius: 9px; line-height: 1.45; }
    .function { border-left: 4px solid var(--accent); background: #0c1728; color: #d6e3f2; }
    .warning { border: 1px solid #ef6464; background: #371d2a; color: #ffe1e1; font-size: .88rem; }
  </style>
</head>
<body>
  <header><h1 id="title">AR Inspection: Fire Extinguisher</h1><p id="subtitle">Place the extinguisher on a clear floor.</p></header>
  <model-viewer id="viewer" ar ar-modes="webxr scene-viewer quick-look" ar-placement="floor" ar-scale="fixed" camera-controls shadow-intensity="1" exposure="1.1">
    <button slot="ar-button" id="ar-button">View this extinguisher in AR</button>
  </model-viewer>
  <p class="tip">Tap the orange button, point at a clear floor, then place the extinguisher. Its type label is attached to the extinguisher body.</p>
  <main><section class="info"><h2>Description and function</h2><p class="description" id="description"></p><div class="function" id="function"></div><div class="warning" id="warning"></div></section></main>
  <script>
    const data = {
      water: { title: 'Water Fire Extinguisher', accent: '#e11d1d', file: 'water', description: 'Class A combustible solids: wood, paper, cardboard and textiles. Rapidly cools the burning material below its ignition temperature.', function: '<b>Function:</b> Uses water to remove heat from Class A fires.', warning: '<b>Do not use on:</b> live electrical equipment, flammable liquids, cooking oils or fats.' },
      foam: { title: 'Foam Fire Extinguisher', accent: '#e7c662', file: 'foam', description: 'Class A combustible solids and Class B flammable liquids: petrol, paints and solvents. Forms a smothering blanket over the fire surface to block oxygen and cool the fuel.', function: '<b>Function:</b> Smothers the fire surface and cools the fuel.', warning: '<b>Do not use on:</b> cooking oils or fats. Keep clear of live electrical equipment unless specifically rated for it.' },
      'dry-powder': { title: 'Dry Powder Fire Extinguisher', accent: '#2861df', file: 'dry-powder', description: 'Class A solids, Class B liquids, Class C flammable gases, and live electrical hazards. Chemically interrupts combustion and smothers flames with a dry chemical agent.', function: '<b>Function:</b> Interrupts combustion and rapidly knocks down flames.', warning: '<b>Note:</b> Avoid small enclosed rooms unless necessary—the powder reduces visibility and breathing comfort.' },
      co2: { title: 'Carbon Dioxide (CO₂) Fire Extinguisher', accent: '#ff9800', file: 'co2', description: 'Live electrical equipment (Class E), switchboards, and Class B flammable liquid fires. Displaces oxygen around the fire and leaves zero residue.', function: '<b>Function:</b> Removes oxygen around the fire without leaving powder or water residue.', warning: '<b>Do not use on:</b> deep-seated Class A fires. Hold the horn by its insulated handle because it becomes extremely cold.' }
    };
    const item = data[new URLSearchParams(location.search).get('extinguisher')] || data.co2;
    document.title = `SafetyVerse AR: ${item.title}`;
    document.documentElement.style.setProperty('--accent', item.accent);
    document.getElementById('title').textContent = `AR Inspection: ${item.title}`;
    document.getElementById('description').textContent = item.description;
    document.getElementById('function').innerHTML = item.function;
    document.getElementById('warning').innerHTML = item.warning;
    const viewer = document.getElementById('viewer');
    viewer.src = `./extinguisher-${item.file}.glb`;
    viewer.setAttribute('ios-src', `./extinguisher-${item.file}.usdz`);
    viewer.alt = `A ${item.title} with a floating information board`;
    document.getElementById('ar-button').textContent = `View ${item.title} in AR`;
  </script>
</body>
</html>
