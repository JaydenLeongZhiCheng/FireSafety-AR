<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Electrical Hazard Inspection</title>
  <!-- Google Model Viewer Library -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <style>
    body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #0F172A; color: white; }
    header { padding: 16px; text-align: center; background: #1E293B; }
    h2 { margin: 0; font-size: 1.1rem; color: #FF9800; }
    p { margin: 4px 0 0; font-size: 0.85rem; color: #94A3B8; }
    model-viewer { width: 100vw; height: 60vh; background-color: #020617; }
    .badge { margin: 16px; padding: 14px; background: rgba(239, 68, 68, 0.15); border: 1px solid #EF4444; border-radius: 8px; text-align: center; }
    .badge b { color: #EF4444; font-size: 1rem; }
  </style>
</head>
<body>
  <header>
    <h2>AR Inspection: Old Fusebox</h2>
    <p>Tap "View in your space" to place in AR</p>
  </header>

  <!-- 3D / AR Viewer -->
  <model-viewer 
    src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" 
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    camera-controls 
    auto-rotate 
    shadow-intensity="1">
  </model-viewer>

  <div class="badge">
    <b>⚠ HAZARD DETECTED: CLASS E</b><br>
    <span style="font-size: 0.8rem; color: #CBD5E1;">Electrical Arc & Live Current Sparks detected. Do NOT use water extinguishers!</span>
  </div>
</body>
</html>
